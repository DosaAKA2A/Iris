<script>
const B = window.BRAND;
function inner(s){return s.paths.map(p=>'<path d="'+p.d+'"'+(p.eo?' fill-rule="evenodd"':'')+'/>').join('')}
function svgOf(s){return '<svg viewBox="0 0 '+s.w+' '+s.h+'" fill="currentColor" style="display:block;width:100%;height:auto">'+inner(s)+'</svg>'}
document.querySelectorAll('[data-shape]').forEach(el=>{ el.innerHTML = svgOf(B[el.dataset.shape]); });
document.querySelectorAll('[data-icon]').forEach(el=>{ const s=B.icons[el.dataset.icon]; if(s) el.innerHTML = svgOf(s); });
</script>
