<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Naviris — case shot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#08080a; --line:#232327; --line-2:#2c2c33;
    --text:#ececef; --muted:#8b8d94; --dim:#5c5e64;
    --violet:#b98cff; --green:#9ee2b8;
    --font:'Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:880px;height:660px;overflow:hidden}
  body{background:#070709;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}

  /* ===== Escena 4:3 ===== */
  .scene{position:relative;width:880px;height:660px;overflow:hidden;
    background:
      radial-gradient(90% 70% at 50% 30%, rgba(122,84,190,.16) 0%, rgba(122,84,190,.05) 42%, transparent 70%),
      radial-gradient(120% 100% at 50% 110%, #0b0b0e 0%, #070709 60%);
  }
  /* Rejilla técnica muy sutil */
  .scene::before{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 78%);
    mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 78%);
  }
  /* Viñeta */
  .scene::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 105% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}

  /* Marca de agua: logo Naviris enorme, apenas visible, saliendo por la esquina */
  .wm{position:absolute;right:-170px;top:-190px;width:520px;height:520px;opacity:.035;transform:rotate(12deg)}
  .wm svg{width:100%;height:100%;fill:#fff}

  /* Chip de marca centrado arriba (despejado de las esquinas: la cartilla pone [05] y + encima) */
  .brand{position:absolute;left:50%;top:30px;transform:translateX(-50%);display:flex;align-items:center;gap:11px;z-index:3}
  .brand .mark{width:24px;height:24px;display:flex}
  .brand .mark svg{width:100%;height:100%;fill:#fff}
  .brand .name{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.15}
  .brand .dom{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em}

  /* ===== Mockup del navegador: frontal con tilt suave (como el hero de naviris.site) ===== */
  .stage{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%);perspective:1700px;perspective-origin:50% 0%;width:790px;z-index:2}
  .mock{position:relative;border-radius:14px;background:#0a0a0c;border:1px solid #26262b;overflow:hidden;aspect-ratio:16/10.6;
    transform:rotateX(14deg);
    box-shadow:
      0 60px 110px rgba(0,0,0,.72),
      0 24px 48px rgba(0,0,0,.55),
      0 0 90px rgba(122,84,190,.10),
      0 1px 0 rgba(255,255,255,.05) inset;
  }
  /* Brillo especular sobre el cristal */
  .mock .glare{position:absolute;inset:0;z-index:9;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.065) 0%,rgba(255,255,255,.018) 28%,transparent 46%)}

  .m-bar{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;background:#0a0a0c}
  .m-tab{display:flex;align-items:center;gap:7px;height:27px;padding:0 13px;border-radius:8px;background:#1b1b1f;font-size:11px;color:var(--text)}
  .m-tab .tdot{width:7px;height:7px;border-radius:50%;background:#45464c}
  .m-tab svg{width:12px;height:12px}
  .m-tab.farm{color:var(--green);border:1px solid rgba(158,226,184,.35);background:rgba(158,226,184,.07)}
  .m-nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 13px;background:#0e0e12;color:var(--dim);font-size:12px}
  .m-url{flex:1;height:23px;border-radius:999px;background:#08080a;border:1px solid #1c1c20;display:flex;align-items:center;padding:0 13px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .m-body{position:absolute;inset:76px 0 0 36px;background:radial-gradient(120% 80% at 50% -10%,#141417 0%,#0a0a0d 60%);display:flex;flex-direction:column;align-items:center;padding-top:5.5%}
  .m-clock{font-size:44px;font-weight:250;letter-spacing:1px}
  .m-greet{font-size:10.5px;color:var(--muted);margin:5px 0 17px}
  .m-search{width:56%;height:31px;border-radius:999px;background:rgba(14,14,17,.85);border:1px solid #26262b;display:flex;align-items:center;padding:0 15px;gap:8px;font-size:10px;color:var(--dim);margin-bottom:24px}
  .m-tiles{display:grid;grid-template-columns:repeat(6,46px);gap:13px}
  .m-tile{width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,#1e1e23,#141418);border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:#e4e6ea}
  .m-tile svg{width:21px;height:21px}
  .m-side{position:absolute;left:0;top:76px;bottom:0;width:36px;background:#08080a;border-right:1px solid #151517;display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:11px;z-index:2}
  .m-side i{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#55565c}
  .m-side i.on{color:var(--violet)}
  .m-side i svg{width:15px;height:15px}

  /* Toast de AutoClaim flotando sobre el mockup: cuenta la historia del producto */
  .float-toast{position:absolute;left:8%;bottom:12%;z-index:4;
    display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:12px;
    background:rgba(13,13,16,.92);border:1px solid #2c2c33;font-size:12.5px;color:var(--text);
    box-shadow:0 22px 48px rgba(0,0,0,.6);backdrop-filter:blur(6px);
    transform:rotateZ(-1deg)}
  .float-toast .pill{font-family:var(--mono);font-size:10.5px;color:var(--violet);letter-spacing:.06em}

  /* Reflejo en el suelo */
  .floor{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:730px;height:120px;z-index:1;
    background:radial-gradient(50% 100% at 50% 0%,rgba(122,84,190,.14) 0%,transparent 70%);
    filter:blur(2px)}
</style>
</head>
