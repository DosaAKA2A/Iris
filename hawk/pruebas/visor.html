<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAWK — prueba del visor</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#070a10;color:#e8ebf2;font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.agarrando{cursor:grabbing}

  .capa{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .capa > *{pointer-events:auto}

  /* ---------------- cinta de brujula ---------------- */
  .brujula{
    height:2.4rem;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(7,10,16,.92),rgba(7,10,16,.35));
    border-bottom:1px solid #232a3a;
  }
  .brujula__cinta{position:absolute;inset:0;will-change:transform}
  .brujula__marca{
    position:absolute;top:0;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:.15rem;transform:translateX(-50%);
    font-family:'Geist Mono',monospace;font-size:.62rem;letter-spacing:.12em;color:#7a869f;
  }
  .brujula__aguja{
    position:absolute;left:50%;top:0;bottom:0;width:1px;background:#f2a33c;
    box-shadow:0 0 10px rgba(242,163,60,.8);
  }

  /* ---------------- instrumentacion ---------------- */
  .instr{
    display:flex;gap:.6rem;align-items:flex-end;justify-content:space-between;
    padding:1rem 1.1rem;flex-wrap:wrap;
    background:linear-gradient(0deg,rgba(7,10,16,.94),transparent);
  }
  .lecturas{display:flex;gap:.5rem;flex-wrap:wrap}
  .lectura{
    border:1px solid #232a3a;background:rgba(11,13,18,.72);border-radius:8px;
    padding:.4rem .65rem;backdrop-filter:blur(6px);
  }
  .lectura__et{
    display:block;font-family:'Geist Mono',monospace;font-size:.58rem;
    letter-spacing:.18em;color:#6b7690;margin-bottom:.15rem;
  }
  .lectura__v{font-family:'Geist Mono',monospace;font-size:.9rem;color:#f2a33c}
  .lectura__v--tenue{color:#c3cadd}

  .botones{display:flex;gap:.5rem;flex-wrap:wrap}
  .bt{
    font:inherit;font-size:.85rem;font-weight:600;color:#e8ebf2;cursor:pointer;
    border:1px solid #3b4763;background:linear-gradient(180deg,#1c2433,#141a26);
    border-radius:10px;padding:.55rem 1rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 rgba(0,0,0,.45);
  }
  .bt:hover{border-color:#4d5c7e}
  .bt--p{
    background:linear-gradient(180deg,#9b8dff,#7b69ff);border-color:#a99dff;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #4b3ec2;
  }

  /* ---------------- credito, obligatorio por CC BY-SA ---------------- */
  /* El credito NO es decoracion: la licencia CC BY-SA obliga a que se lea, y
     encima de una foto cualquiera el texto suelto desaparece. Va sobre su
     propia banda opaca. */
  .credito{
    font-family:'Geist Mono',monospace;font-size:.62rem;color:#9aa4bb;
    padding:.5rem 1.1rem .7rem;letter-spacing:.04em;
    background:#070a10;border-top:1px solid #1a2130;
  }
  .credito a{color:#c3cadd}

  /* ---------------- estados ---------------- */
  .aviso{
    position:fixed;inset:0;display:grid;place-content:center;gap:.6rem;text-align:center;
    background:#070a10;padding:2rem;
  }
  .aviso__t{font-size:1.05rem;font-weight:600}
  .aviso__d{color:#8b95ad;font-size:.88rem;max-width:44ch;line-height:1.5}
  .aviso code{font-family:'Geist Mono',monospace;color:#f2a33c;font-size:.82rem}
  .oculto{display:none}

  .cargando{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:'Geist Mono',monospace;font-size:.7rem;letter-spacing:.2em;color:#7b69ff;
  }
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<div class="capa" id="capa" hidden>
  <div class="brujula">
    <div class="brujula__cinta" id="cinta"></div>
    <div class="brujula__aguja"></div>
  </div>

  <div>
    <div class="instr">
      <div class="lecturas">
        <div class="lectura"><span class="lectura__et">RUMBO</span><span class="lectura__v" id="l-rumbo">---</span></div>
        <div class="lectura"><span class="lectura__et">CAMPO</span><span class="lectura__v" id="l-fov">--</span></div>
        <div class="lectura"><span class="lectura__et">CUADROS</span><span class="lectura__v" id="l-fps">--</span></div>
        <div class="lectura"><span class="lectura__et">FOTO</span><span class="lectura__v lectura__v--tenue" id="l-n">-/-</span></div>
        <div class="lectura"><span class="lectura__et">DONDE</span><span class="lectura__v lectura__v--tenue" id="l-donde">oculto</span></div>
        <div class="lectura"><span class="lectura__et">TEXTURA</span><span class="lectura__v lectura__v--tenue" id="l-tex">----</span></div>
      </div>
      <div class="botones">
        <button class="bt" id="bt-nitidez">Nitidez</button>
        <button class="bt" id="bt-donde">Revelar</button>
        <button class="bt bt--p" id="bt-sig">Siguiente</button>
      </div>
    </div>
    <p class="credito" id="credito"></p>
  </div>
</div>

<p class="cargando" id="cargando">CARGANDO</p>

<div class="aviso oculto" id="aviso">
  <p class="aviso__t" id="aviso-t"></p>
  <p class="aviso__d" id="aviso-d"></p>
</div>

<script type="module">
/* HAWK — banco de pruebas del visor.
   ---------------------------------------------------------------------------
   Esto NO es el juego: es el banco donde se comprueba que el visor cumple. El
   visor de verdad vive en ../js/visor.js y es el mismo que usa la ronda; aqui
   solo estan los mandos para hacerle perrerias.

   Tres cosas que se miran desde aqui:
     ?rejilla=1   sube una equirectangular sintetica de geometria conocida, que
                  es la unica forma de distinguir un fallo de proyeccion de una
                  foto tomada con la camara torcida (hay muchas).
     Nitidez      compara 1024 / 2048 / original en el MISMO encuadre.
     CUADROS      tiempo de cuadro real, que es lo que decide si esto se juega.

   Las fotos las deja banco/resolver.mjs en puntos.json. En el juego de verdad
   esa traduccion ID -> URL la hara el worker, porque el token de Mapillary no
   puede bajar al navegador. */

import { crearVisor, SinWebGL } from '../js/visor.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);

/* --------------------------- datos --------------------------- */

let datos;
try {
  const r = await fetch('puntos.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status);
  datos = await r.json();
} catch {
  fallo('Falta puntos.json',
    'Genera las fotos de prueba con  node --env-file=.env resolver.mjs  desde hawk/banco/.');
}

if (!datos?.fotos?.length) {
  fallo('puntos.json esta vacio', 'El banco no devolvio ninguna esferica utilizable.');
}

/* Las URLs del CDN van firmadas y caducan a los 30 dias. Sin este aviso, una
   prueba rancia se ve como un visor roto y se pierde media tarde buscando un
   fallo que no existe. */
if (datos.caduca && new Date(datos.caduca) < new Date()) {
  fallo('Las URLs caducaron',
    'La firma del CDN de Mapillary dura 30 dias. Vuelve a lanzar  node --env-file=.env resolver.mjs.');
}

/* --------------------------- visor --------------------------- */

let visor;
try {
  visor = crearVisor($('lienzo'), { alPintar: instrumentos });
} catch (e) {
  if (e instanceof SinWebGL) fallo('Sin WebGL', e.message);
  throw e;
}

let i = 0;
let revelado = false;

/* La resolucion no es un detalle de rendimiento, es una decision de juego: si
   no se lee un cartel, el jugador no tiene de donde agarrarse y la ronda se
   vuelve una loteria. Medido: cambiar de 2048 a 5760 no cuesta NI UN
   milisegundo de cuadro, porque el coste va con los pixeles de pantalla. */
const RESOLUCIONES = ['imgLigera', 'img', 'imgGrande'];
const NOMBRES = { imgLigera: '1024', img: '2048', imgGrande: 'original' };
const pedida = q.get('res');
let res = pedida === null ? 1 : Math.max(0, RESOLUCIONES.findIndex((r) => NOMBRES[r] === pedida));

$('bt-sig').addEventListener('click', () => cargar(i + 1));
$('bt-donde').addEventListener('click', () => { revelado = !revelado; pintarDonde(); });
$('bt-nitidez').addEventListener('click', () => {
  res = (res + 1) % RESOLUCIONES.length;
  cargar(i, true);   // el mismo encuadre, o la comparacion no vale nada
});

/* --------------------------- carga --------------------------- */

async function cargar(n, mantenerVista = false) {
  i = ((n % datos.fotos.length) + datos.fotos.length) % datos.fotos.length;
  const foto = datos.fotos[i];
  $('cargando').hidden = false;
  $('cargando').textContent = 'CARGANDO';

  /* Modo rejilla: en vez de una foto se sube una equirectangular sintetica. Con
     ella, a pitch 0 el ecuador TIENE que salir recto y horizontal por el centro
     exacto, y los meridianos rectos y verticales. Si eso sale, el shader esta
     bien y lo torcido es la camara del que tomo la foto. */
  if (q.has('rejilla')) {
    await visor.cargar(rejilla());
    visor.arranca();
    $('cargando').hidden = true;
    $('capa').hidden = false;
    $('l-tex').textContent = 'rejilla';
    $('credito').textContent = 'Rejilla sintetica: ecuador en ambar, meridianos cada 15 grados.';
    return;
  }

  const t0 = performance.now();
  let ancho, alto;
  try {
    [ancho, alto] = await visor.cargar(foto[RESOLUCIONES[res]] || foto.img);
  } catch {
    $('cargando').textContent = 'ESA FOTO YA NO ESTA';
    return;
  }

  /* Se entra mirando al frente de la foto. Al cambiar de nitidez NO se toca la
     vista, o la comparacion no sirve para nada. */
  if (!mantenerVista) {
    visor.mirarA({ yaw: 0, pitch: 0 });
    revelado = false;
  }

  pintarDonde();
  $('l-n').textContent = `${i + 1}/${datos.fotos.length}`;
  $('l-tex').textContent = String(ancho);
  $('credito').innerHTML = `Foto <a href="https://www.mapillary.com/app?focus=photo&pKey=${foto.id}" target="_blank" rel="noopener">${foto.id}</a> `
    + `— Mapillary, CC BY-SA 4.0 — ${ancho}x${alto} en ${Math.round(performance.now() - t0)} ms`;
  $('cargando').hidden = true;
  $('capa').hidden = false;
  visor.arranca();
}

function pintarDonde() {
  $('l-donde').textContent = revelado ? datos.fotos[i].pais : 'oculto';
  $('bt-donde').textContent = revelado ? 'Ocultar' : 'Revelar';
}

/* --------------------------- brujula --------------------------- */

const RUMBOS = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
const cinta = $('cinta');
/* Una vuelta y nada mas: la posicion se calcula en modulo 360, asi que repetir
   la cinta a los lados solo apilaria marcas en el mismo sitio. */
for (let g = 0; g < 360; g += 15) {
  const m = document.createElement('span');
  m.className = 'brujula__marca';
  m.dataset.g = g;
  m.textContent = g % 45 === 0 ? RUMBOS[g / 45] : '.';
  cinta.append(m);
}
const marcas = [...cinta.children];

/* --------------------------- instrumentos --------------------------- */

let cuadros = 0, tFps = performance.now();

function instrumentos(est) {
  const foto = datos.fotos[i];
  /* El rumbo de verdad es el de la camara mas lo que se haya girado. Sin sumar
     compass_angle, la brujula seria pura decoracion. */
  const grados = (((foto?.rumbo || 0) - (est.yaw * 180) / Math.PI) % 360 + 360) % 360;
  $('l-rumbo').textContent = `${String(Math.round(grados)).padStart(3, '0')}°`;
  $('l-fov').textContent = `${Math.round((est.fov * 180) / Math.PI)}°`;

  /* La cinta va al paso del paisaje con el campo HORIZONTAL. Con el vertical a
     secas se desliza mas lenta que la imagen y canta enseguida. */
  const fovH = (est.fovH * 180) / Math.PI;
  const porGrado = 100 / fovH;
  for (const m of marcas) {
    const d = ((Number(m.dataset.g) - grados + 540) % 360) - 180;
    if (Math.abs(d) > fovH / 2 + 10) { m.style.opacity = 0; continue; }
    m.style.opacity = 1;
    m.style.left = `${50 + d * porGrado}%`;
  }

  cuadros++;
  const ahora = performance.now();
  if (ahora - tFps >= 500) {
    $('l-fps').textContent = Math.round((cuadros * 1000) / (ahora - tFps));
    cuadros = 0; tFps = ahora;
  }
}

/* --------------------------- rejilla de verificacion --------------------------- */

/* Equirectangular de prueba de 2048x1024. Todo lo que se dibuja aqui son lineas
   de latitud y longitud constantes, asi que cualquier curva o inclinacion que
   salga en pantalla la ha metido el shader. */
function rejilla() {
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 1024;
  const x = c.getContext('2d');
  x.fillStyle = '#0d1220'; x.fillRect(0, 0, c.width, c.height);

  const px = c.width / 360, py = c.height / 180;
  /* El convenio de la equirectangular pone el CENTRO de la imagen en la
     direccion a la que apunta la camara, no en el borde izquierdo. Dibujar el
     meridiano 0 en x=0 deja el SUR en el centro cuando se mira al norte, que es
     justo la clase de error que esta rejilla existe para cazar. */
  const aX = (lon) => ((((lon + 180) % 360) + 360) % 360) * px;

  x.lineWidth = 2;
  for (let lon = 0; lon < 360; lon += 15) {
    x.strokeStyle = lon % 90 === 0 ? '#7b69ff' : '#2b3448';
    x.beginPath(); x.moveTo(aX(lon), 0); x.lineTo(aX(lon), c.height); x.stroke();
  }
  for (let lat = -75; lat <= 75; lat += 15) {
    x.strokeStyle = lat === 0 ? '#f2a33c' : '#2b3448';
    x.lineWidth = lat === 0 ? 4 : 2;
    const y = (90 - lat) * py;
    x.beginPath(); x.moveTo(0, y); x.lineTo(c.width, y); x.stroke();
  }

  x.fillStyle = '#e8ebf2';
  x.font = '600 34px monospace';
  x.textAlign = 'center';
  for (const [lon, et] of [[0, 'N'], [90, 'E'], [180, 'S'], [270, 'O']]) {
    x.fillText(et, aX(lon), (90 - 8) * py);
  }
  return c;
}

/* --------------------------- utilidades --------------------------- */

function fallo(titulo, detalle) {
  $('cargando').hidden = true;
  $('capa').hidden = true;
  $('aviso').classList.remove('oculto');
  $('aviso-t').textContent = titulo;
  $('aviso-d').textContent = detalle;
  throw new Error(`${titulo}: ${detalle}`);
}

/* ?foto=N, ?yaw=, ?pitch= y ?fov= sirven para volver al MISMO encuadre en dos
   capturas distintas; sin eso no se puede comparar nada de una corrida a otra. */
await cargar(Number(q.get('foto') || 0));
visor.mirarA({
  yaw: Number(q.get('yaw') || 0) * Math.PI / 180,
  pitch: Number(q.get('pitch') || 0) * Math.PI / 180,
  fov: q.has('fov') ? Number(q.get('fov')) * Math.PI / 180 : 1.3,
});
</script>
</body>
</html>
